name: Build APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "API_URL, ví dụ http://192.168.1.10:5080/api/v1"
        required: true
        default: "http://192.168.1.10:5080/api/v1"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name smart_drone_mobile --org vn.edu.ut .
      - run: sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_URL=${{ inputs.api_url }}
      - uses: actions/upload-artifact@v4
        with:
          name: smart-drone-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
