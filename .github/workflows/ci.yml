name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore src/SmartDrone.Api/SmartDrone.Api.csproj
      - run: dotnet build src/SmartDrone.Api/SmartDrone.Api.csproj --no-restore -c Release
