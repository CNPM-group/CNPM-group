<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDroneDelivery - Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .login-box {
      box-sizing: border-box;
      width: 370px;
      max-width: calc(100% - 32px);
      padding: 25px;
      background: white;
      border: 1px solid #aaa;
      border-radius: 12px;
    }

    h2, p { text-align: center; }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 9px;
      font-size: 14px;
    }

    input { border: 1px solid #aaa; }

    button {
      border: none;
      background: #4b91ed;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    a { color: #168bff; }

    #message {
      overflow-wrap: anywhere;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="login-box">
    <h2>Smart Drone Delivery</h2>
    <p>AI-powered Drone Delivery</p>

    <form id="loginForm">
      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button id="submitButton" type="submit">Login</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p>Don't have an account?
      <a href="register.html">Create an account</a>
    </p>
  </main>

  <script>
    // Cần thay bằng địa chỉ backend thật của nhóm.
    const API_BASE_URL = "";

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!API_BASE_URL) {
        message.textContent =
          "Chưa cấu hình địa chỉ API. Vui lòng xác định backend của nhóm.";
        return;
      }

      submitButton.disabled = true;
      message.textContent = "Đang đăng nhập...";

      try {
        const response = await fetch(
          `${API_BASE_URL}/api/v1/auth/login`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
          }
        );

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          message.textContent =
            data
