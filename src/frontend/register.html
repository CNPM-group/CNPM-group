<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDroneDelivery - Register</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .register-box {
      box-sizing: border-box;
      width: 370px;
      max-width: calc(100% - 32px);
      padding: 25px;
      background: white;
      border: 1px solid #aaa;
      border-radius: 12px;
    }

    h2, p { text-align: center; }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 9px;
      font-size: 14px;
    }

    input { border: 1px solid #aaa; }

    button {
      border: none;
      background: #4b91ed;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    a { color: #168bff; }

    #message {
      overflow-wrap: anywhere;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="register-box">
    <h2>Smart Drone Delivery</h2>
    <p>AI-powered Drone Delivery</p>

    <form id="registerForm">
      <input id="fullName" type="text"
        placeholder="Enter your full name"
        autocomplete="name" required>

      <input id="email" type="email"
        placeholder="Enter your email"
        autocomplete="email" required>

      <input id="password" type="password"
        placeholder="Enter your password"
        autocomplete="new-password"
        minlength="8" required>

      <input id="confirmPassword" type="password"
        placeholder="Confirm your password"
        autocomplete="new-password" required>

      <button id="submitButton" type="submit">Register</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p>Already have an account?
      <a href="login.html">Login</a>
    </p>
  </main>

  <script>
    // Thay bằng địa chỉ backend thật khi đã xác định được.
    const API_BASE_URL = "";

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        message.textContent = "Mật khẩu xác nhận không khớp.";
        return;
      }

      if (!API_BASE_URL) {
        message.textContent =
          "Chưa cấu hình địa chỉ API. Vui lòng liên hệ nhóm để xác định backend.";
        return;
      }

      submitButton.disabled = true;
      message.textContent = "Đang tạo tài khoản...";

      try {
        const response = await fetch(
  `${API_BASE_URL}/api/v1/auth/register`,
  {
    method: "POST",
    credentials: "include",
    headers: {
      "Content-Type": "application/json"
    },
            body: JSON.stringify({
              fullName: fullName,
              email: email,
              password: password
            })
          }
        );

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          const errors = data.errors?.auth
            || data.errors?.Auth
            || data.detail
            || data.title;

          message.textContent = Array.isArray(errors)
            ? errors.join(" ")
            : (errors || "Đăng ký thất bại. Vui lòng kiểm tra thông tin.");
          return;
        }

        message.textContent =
          "Đăng ký thành công! Bạn có thể chuyển sang trang đăng nhập.";

        form.reset();
      } catch (error) {
        message.textContent =
          "Không kết nối được API. Hãy kiểm tra địa chỉ backend và kết nối mạng.";
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
