<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn hàng của tôi - SmartDroneDelivery</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #243247;
    }
    .container {
      max-width: 900px;
      margin: auto;
    }
    h1 { color: #1769aa; }
    .card {
      background: white;
      padding: 20px;
      margin: 16px 0;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0000000d;
    }
    input, button {
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 14px;
    }
    input { width: 100%; margin-bottom: 10px; }
    button {
      background: #1769aa;
      color: white;
      border: 0;
      cursor: pointer;
    }
    .order {
      border: 1px solid #dbe3ed;
      border-radius: 9px;
      padding: 14px;
      margin-top: 12px;
    }
    .muted { color: #68778b; }
    .timeline {
      border-left: 3px solid #1769aa;
      margin: 16px 0 0 6px;
      padding-left: 18px;
    }
    .event { margin-bottom: 16px; }
    .event strong { display: block; }
    .error { color: #c62828; }
    a { color: #1769aa; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Đơn hàng của tôi</h1>
    <p class="muted">Theo dõi đơn hàng và lịch sử trạng thái giao hàng.</p>

    <section class="card">
      <label for="search">Tìm theo mã đơn hàng</label>
      <input id="search" placeholder="Ví dụ: SDD123456">
      <button id="searchBtn">Tìm đơn</button>
      <button id="showAll">Hiện tất cả</button>
      <div id="orders"></div>
    </section>

    <section class="card" id="detail" hidden>
      <h2>Chi tiết đơn hàng</h2>
      <div id="detailContent"></div>
    </section>

    <p><a href="create-order.html">+ Tạo đơn giao hàng</a></p>
  </main>

  <script>
    const KEY = "smartDroneDeliveryOrders";
    const ordersBox = document.getElementById("orders");
    const detailBox = document.getElementById("detail");
    const detailContent = document.getElementById("detailContent");

    function getOrders() {
      try {
        const data = JSON.parse(localStorage.getItem(KEY) || "[]");
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function safe(value) {
      const div = document.createElement("div");
      div.textContent = String(value ?? "");
      return div.innerHTML;
    }

    function renderOrders(list) {
      detailBox.hidden = true;
      if (!list.length) {
        ordersBox.innerHTML =
          '<p class="muted">Chưa có đơn hàng phù hợp. Hãy tạo đơn trước.</p>';
        return;
      }

      ordersBox.innerHTML = list.map(order => `
        <article class="order">
          <strong>Mã đơn: ${safe(order.id)}</strong>
          <p>Trạm gửi: ${safe(order.from)}</p>
          <p>Trạm nhận: ${safe(order.to)}</p>
          <p>Trạng thái: ${safe(order.status || "Chờ xử lý")}</p>
          <button data-id="${safe(order.id)}">Xem chi tiết</button>
        </article>
      `).join("");

      ordersBox.querySelectorAll("button[data-id]").forEach(button => {
        button.addEventListener("click", () => {
          const order = getOrders().find(item => item.id === button.dataset.id);
          if (order) showDetail(order);
        });
      });
    }

    function showDetail(order) {
      detailBox.hidden = false;
      const history = Array.isArray(order.history) ? order.history : [
        {
          status: order.status || "Chờ xử lý",
          time: order.createdAt || "Chưa có thời gian",
          note: "Đơn hàng được tạo"
        }
      ];

      detailContent.innerHTML = `
        <p><strong>Mã đơn:</strong> ${safe(order.id)}</p>
        <p><strong>Trạm gửi:</strong> ${safe(order.from)}</p>
        <p><strong>Trạm nhận:</strong> ${safe(order.to)}</p>
        <p><strong>Cân nặng:</strong> ${safe(order.weight)} kg</p>
        <p><strong>Kích thước (D × R × C):</strong>
          ${safe(order.length)} × ${safe(order.width)} × ${safe(order.height)} cm</p>
        <p><strong>Trạng thái hiện tại:</strong> ${safe(order.status || "Chờ xử lý")}</p>
        <h3>Dòng thời gian trạng thái</h3>
        <div class="timeline">
          ${history.map(item => `
            <div class="event">
              <strong>${safe(item.status)}</strong>
              <span>${safe(item.time)}</span>
              <p>${safe(item.note || "")}</p>
            </div>
          `).join("")}
        </div>
      `;
    }

    document.getElementById("searchBtn").addEventListener("click", () => {
      const query = document.getElementById("search").value.trim().toLowerCase();
      renderOrders(getOrders().filter(order =>
        String(order.id).toLowerCase().includes(query)
      ));
    });

    document.getElementById("showAll").addEventListener("click", () => {
      document.getElementById("search").value = "";
      renderOrders(getOrders());
    });

    renderOrders(getOrders());
  </script>
</body>
</html>
