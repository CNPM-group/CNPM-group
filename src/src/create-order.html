
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo đơn - SmartDroneDelivery</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 30px 16px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #243047;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 { margin-bottom: 8px; }

    .subtitle {
      color: #64748b;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      padding: 24px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      margin-bottom: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .dimensions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    label {
      display: block;
      margin: 14px 0 8px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 15px;
      background: white;
    }

    input:focus, select:focus {
      outline: 2px solid #bfdbfe;
      border-color: #2563eb;
    }

    button {
      margin-top: 22px;
      padding: 12px 20px;
      border: 0;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }

    .message {
      margin-top: 14px;
      font-size: 14px;
    }

    .error { color: #dc2626; }
    .success { color: #15803d; }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
    }

    th {
      background: #f8fafc;
      font-size: 14px;
    }

    .status {
      color: #1d4ed8;
      background: #dbeafe;
      border-radius: 20px;
      padding: 5px 9px;
      font-size: 12px;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      .dimensions { gap: 8px; }
      .card { padding: 16px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Tạo đơn giao hàng</h1>
    <p class="subtitle">
      SmartDroneDelivery | Quản lý đơn giao hàng bằng drone
    </p>

    <section class="card">
      <h2>Thông tin giao hàng</h2>

      <form id="orderForm">
        <div class="grid">
          <div>
            <label for="from">Trạm đi</label>
            <select id="from" required>
              <option value="">-- Chọn trạm đi --</option>
              <option value="ST01">ST01 - Trạm Trung tâm</option>
              <option value="ST02">ST02 - Trạm Khu A</option>
              <option value="ST03">ST03 - Trạm Khu B</option>
              <option value="ST04">ST04 - Trạm Khu C</option>
            </select>
          </div>

          <div>
            <label for="to">Trạm đến</label>
            <select id="to" required>
              <option value="">-- Chọn trạm đến --</option>
              <option value="ST01">ST01 - Trạm Trung tâm</option>
              <option value="ST02">ST02 - Trạm Khu A</option>
              <option value="ST03">ST03 - Trạm Khu B</option>
              <option value="ST04">ST04 - Trạm Khu C</option>
            </select>
          </div>
        </div>

        <h3>Thông tin kiện hàng</h3>

        <label for="weight">Cân nặng (kg)</label>
        <input id="weight" type="number"
          min="0.01" max="20" step="0.01"
          placeholder="Ví dụ: 2.5" required>

        <div class="dimensions">
          <div>
            <label for="length">Dài (cm)</label>
            <input id="length" type="number"
              min="0.1" max="100" step="0.1"
              placeholder="30" required>
          </div>

          <div>
            <label for="width">Rộng (cm)</label>
            <input id="width" type="number"
              min="0.1" max="100" step="0.1"
              placeholder="20" required>
          </div>

          <div>
            <label for="height">Cao (cm)</label>
            <input id="height" type="number"
              min="0.1" max="100" step="0.1"
              placeholder="15" required>
          </div>
        </div>

        <button type="submit">+ Tạo đơn hàng</button>
        <p id="message" class="message" aria-live="polite"></p>
      </form>
    </section>

    <section class="card">
      <h2>Danh sách đơn hàng</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Mã đơn</th>
              <th>Trạm đi</th>
              <th>Trạm đến</th>
              <th>Cân nặng</th>
              <th>Kích thước (cm)</th>
              <th>Trạng thái</th>
            </tr>
          </thead>
          <tbody id="orderList"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const stations = {
      ST01: "ST01 - Trạm Trung tâm",
      ST02: "ST02 - Trạm Khu A",
      ST03: "ST03 - Trạm Khu B",
      ST04: "ST04 - Trạm Khu C"
    };

    // Dữ liệu giả ban đầu
    const orders = [
      {
        id: "SDD001",
        from: "ST01",
        to: "ST02",
        weight: 2.5,
        length: 30,
        width: 20,
        height: 15,
        status: "Chờ xử lý"
      }
    ];

    const form = document.getElementById("orderForm");
    const message = document.getElementById("message");
    const orderList = document.getElementById("orderList");

    function renderOrders() {
      orderList.replaceChildren();

      orders.forEach(order => {
        const row = document.createElement("tr");
        const values = [
          order.id,
          stations[order.from],
          stations[order.to],
          order.weight + " kg",
          `${order.length} × ${order.width} × ${order.height}`,
          order.status
        ];

        values.forEach((value, index) => {
          const cell = document.createElement("td");

          if (index === 5) {
            const badge = document.createElement("span");
            badge.className = "status";
            badge.textContent = value;
            cell.appendChild(badge);
          } else {
            cell.textContent = value;
          }

          row.appendChild(cell);
        });

        orderList.appendChild(row);
      });
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const from = document.getElementById("from").value;
      const to = document.getElementById("to").value;
      const weight = Number(document.getElementById("weight").value);
      const length = Number(document.getElementById("length").value);
      const width = Number(document.getElementById("width").value);
      const height = Number(document.getElementById("height").value);

      if (!from || !to) {
        showMessage("Vui lòng chọn cả trạm đi và trạm đến.", true);
        return;
      }

      if (from === to) {
        showMessage("Trạm đi và trạm đến phải khác nhau.", true);
        return;
      }

      if (!Number.isFinite(weight) || weight <= 0 || weight > 20) {
        showMessage("Cân nặng phải lớn hơn 0 và không quá 20 kg.", true);
        return;
      }

      const dimensions = [length, width, height];

      if (dimensions.some(n =>
        !Number.isFinite(n) || n <= 0 || n > 100
      )) {
        showMessage(
          "Mỗi kích thước phải lớn hơn 0 và không quá 100 cm.",
          true
        );
        return;
      }

      const order = {
        id: "SDD" + String(Date.now()).slice(-8),
        from,
        to,
        weight,
        length,
        width,
        height,
        status: "Chờ xử lý"
      };

      orders.unshift(order);
      renderOrders();
      form.reset();

      showMessage("Tạo đơn hàng thành công!", false);
    });

    function showMessage(text, isError) {
      message.textContent = text;
      message.className = "message " +
        (isError ? "error" : "success");
    }

    renderOrders();
  </script>
</body>
</html>
