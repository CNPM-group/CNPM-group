
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDroneDelivery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h2>🚁 SmartDroneDelivery</h2>
    <p>AI-powered Drone Delivery Management Platform</p>
  </header>

  <nav class="navigation">
    <button onclick="showPage('login')">Đăng nhập</button>
    <button onclick="showPage('create')">Tạo đơn</button>
    <button onclick="showPage('orders')">Danh sách đơn</button>
    <button onclick="showPage('status')">Trạng thái</button>
    <button onclick="showPage('confirm')">Xác nhận giao</button>
  </nav>

  <main>
    <section id="login" class="page">
      <h2>Đăng nhập</h2>
      <form onsubmit="login(event)">
        <label>Email</label>
        <input id="email" type="email" placeholder="Nhập email" required>
        <label>Mật khẩu</label>
        <input id="password" type="password" placeholder="Nhập mật khẩu" required>
        <button type="submit">Đăng nhập</button>
      </form>
      <p id="loginMessage"></p>
    </section>

    <section id="create" class="page hidden">
      <h2>Tạo đơn giao hàng</h2>
      <form onsubmit="createOrder(event)">
        <label>Địa chỉ lấy hàng</label>
        <input id="pickup" placeholder="Nhập địa chỉ lấy hàng" required>
        <label>Địa chỉ giao hàng</label>
        <input id="delivery" placeholder="Nhập địa chỉ giao hàng" required>
        <label>Tên người nhận</label>
        <input id="recipient" placeholder="Nhập tên người nhận" required>
        <label>Số điện thoại</label>
        <input id="phone" type="tel" placeholder="Nhập số điện thoại" required>
        <label>Mô tả kiện hàng</label>
        <input id="description" placeholder="Ví dụ: Tài liệu" required>
        <label>Khối lượng (kg)</label>
        <input id="weight" type="number" min="0.1" step="0.1" required>
        <button type="submit">Tạo đơn hàng</button>
      </form>
      <p id="createMessage"></p>
    </section>

    <section id="orders" class="page hidden">
      <h2>Danh sách đơn hàng</h2>
      <div id="orderList">Chưa có đơn hàng.</div>
    </section>

    <section id="status" class="page hidden">
      <h2>Trạng thái đơn hàng</h2>
      <label>Chọn đơn hàng</label>
      <select id="statusOrder" onchange="showStatus()"></select>
      <p id="statusInfo">Chưa có đơn hàng.</p>
      <button onclick="advanceStatus()">Cập nhật trạng thái mẫu</button>
    </section>

    <section id="confirm" class="page hidden">
      <h2>Xác nhận giao hàng</h2>
      <label>Chọn đơn hàng</label>
      <select id="confirmOrder"></select>
      <p id="confirmInfo">Vui lòng chọn đơn hàng.</p>
      <button onclick="confirmDelivery()">Xác nhận đã nhận hàng</button>
    </section>
  </main>

  <footer>
    <p>SmartDroneDelivery | Đồ án Công nghệ phần mềm</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
